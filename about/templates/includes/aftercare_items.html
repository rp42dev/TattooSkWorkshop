<div class="col-12 col-xl-10 col-xxl-8 mx-auto d-flex flex-column gap-5 mb-5">
  <!-- Print-Only Header Title -->
  <div class="d-none d-print-block text-center mb-4">
    <h1 style="font-family: 'Outfit', 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 26px; font-weight: 800; color: #000000; text-transform: uppercase; margin: 0 0 5px 0; letter-spacing: 0.05em;">
      ANDREJS TATTOO
    </h1>
    <h2 style="font-family: 'Outfit', 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 18px; font-weight: bold; color: #555555; text-transform: uppercase; margin: 0 0 20px 0; border-bottom: 2px solid #000000; padding-bottom: 10px; letter-spacing: 0.1em;">
      {% if LANGUAGE_CODE == 'en' %}Aftercare Instructions{% else %}Ettervernsråd{% endif %}
    </h2>
  </div>

  {% for article in articles %}
  <div class="glass-card">
    <h3 class="clipped-text mb-4">{{ article.subtitle }}</h3>
    <div class="text-light">
      {{ article.body|safe }}
    </div>
  </div>
  {% endfor %}
  
  <div class="mx-3">
    {% include 'includes/contact_card.html' %}
  </div>
  {% include 'includes/print_button.html' %}
</div>
