{% load i18n %}
{% get_current_language as LANGUAGE_CODE %}

<div class="h-100 col-12 col-xl-10 col-xxl-8 mx-auto position-relative">
  <!-- Premium Dark Map Container -->
  <div class="map-container-custom">
    <iframe
      src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d1997.6171599883533!2d11.04726867715365!3d59.95508557492345!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x464163e354ade151%3A0x1cb1e2af192f78ac!2sAndrejs%20Tattoo!5e0!3m2!1sen!2sie!4v1781899324444!5m2!1sen!2sie"
      width="100%" height="450" style="border:0;" allowfullscreen="" loading="lazy" aria-label="Google Maps Location"></iframe>
    
    <!-- Floating Glassmorphic Location Badge -->
    <div class="map-floating-badge glass-card p-3">
      <h4 class="m-0 text-uppercase" style="font-size: 1.1rem; color: var(--premium-bronze); letter-spacing: 0.05em;">Andrejs Tattoo</h4>
      <p class="m-0 mt-1 small text-muted">Solheimsgata 1, 2000 Lillestrøm</p>
      <a href="https://maps.google.com/?q=Andrejs+Tattoo+Lillestrom" target="_blank" class="btn btn-sm mt-3 w-100 map-badge-btn">
        <i class="bi bi-geo-alt-fill"></i>&nbsp;&nbsp;{% if LANGUAGE_CODE == 'en' %}Open in Google Maps{% else %}Åpne i Google Maps{% endif %}
      </a>
    </div>
  </div>
</div>

<div class="col-12 col-xl-10 col-xxl-8 mx-auto mt-4 mb-5">
  <div class="mx-3">
    {% include 'includes/contact_card.html' %}
  </div>
</div>
