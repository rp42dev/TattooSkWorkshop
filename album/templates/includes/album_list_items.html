{% load static %}
{% load i18n %}
{% load thumbnail %}

{% for item in object_list %}
{% if forloop.last and page_obj.has_next %}
<div class="col-6 col-xl-4 col-xxl-3" hx-get="{{url}}?page={{ page_obj.next_page_number }}" hx-trigger="revealed"
  hx-swap="afterend" hx-target="this">
  {% else %}
  <div class="col-6 col-xl-4 col-xxl-3">
    {% endif %}
    <div class="gallery-card rounded-3 h-100 bg-transparent">
      <div class="loading-card rounded-3 p-0 overflow-hidden position-relative">
        {% if item.image %}
        <picture>
          <source
            srcset="{% thumbnail item.image "360x640" crop="center" format="WEBP" as img %}{{ img.url }} {% endthumbnail %} 640w, 
                {% thumbnail item.image "540x960" crop="center" format="WEBP" as img %}{{ img.url }}{% endthumbnail %} 960w,
                {% thumbnail item.image "720x1280" crop="center" format="WEBP" as img %}{{ img.url }}{% endthumbnail %} 1280w"
            type="image/webp">
          <img class="gallery-card-img img-fluid rounded-3 lazy"
            src="{% thumbnail item.image "480x854" crop="center" as img %}{{ img.url }} {% endthumbnail %}"
            onload="this.classList.add('loaded'); this.closest('.loading-card').classList.add('loaded');"
            alt="{{ item.name|default:'Tattoo' }} image">
        </picture>
        <a href="{{ item.get_absolute_url }}">
          <div class="gallery-card-overlay p-3 text-left rounded-3 d-flex flex-column justify-content-end">
            <h3 class="gallery-card-title m-0">
              {% if item.artist %}{{ item.artist }}{% else %}{{ item.name }}{% endif %}
            </h3>
          </div>
        </a>
        {% endif %}
      </div>
    </div>
  </div>
  {% endfor %}


  <script>
    // Handle cached or already complete images on initial load / htmx swap
    document.querySelectorAll('.gallery-card-img').forEach(function(img) {
      if (img.complete) {
        img.classList.add('loaded');
        var loader = img.closest('.loading-card');
        if (loader) loader.classList.add('loaded');
      }
    });
  </script>
