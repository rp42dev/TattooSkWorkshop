{% load i18n %}
{% load static %}
{% load crispy_forms_tags %}

<style>
  ul {
    list-style-type: none;
    margin: 0;
    padding: 0;
    overflow: hidden;
    background-color: #333;
  }

  li {
    float: left;
  }

  /* Make contact form text, inputs, and spacings smaller and premium */
  #swap_form form .mb-3,
  #swap_form form .form-group {
    margin-bottom: 0.65rem !important;
  }

  #swap_form form label,
  #swap_form form .form-label {
    font-size: 0.78rem !important;
    margin-bottom: 0.15rem !important;
    font-weight: 500;
    color: rgba(224, 224, 224, 0.75) !important;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }

  #swap_form form .form-control,
  #swap_form form input,
  #swap_form form textarea,
  #swap_form form select {
    font-size: 0.82rem !important;
    padding: 0.4rem 0.7rem !important;
    border-radius: 8px !important;
    background-color: rgba(255, 255, 255, 0.03) !important;
    border: 1px solid rgba(255, 255, 255, 0.1) !important;
    color: #fff !important;
    transition: all 0.2s ease;
  }

  #swap_form form .form-control:focus {
    background-color: rgba(255, 255, 255, 0.05) !important;
    border-color: var(--premium-bronze) !important;
    box-shadow: 0 0 0 0.25rem rgba(212, 175, 55, 0.15) !important;
  }

  #swap_form form textarea.form-control {
    min-height: 70px !important;
    height: 80px !important;
    resize: vertical;
  }

  /* Highlight Submit Button with Premium Bronze Theme */
  #swap_form form button[type="submit"] {
    background: var(--premium-gradient) !important;
    color: #050809 !important;
    font-weight: 600 !important;
    letter-spacing: 0.06em !important;
    text-transform: uppercase !important;
    font-size: 0.82rem !important;
    padding: 0.5rem 1.25rem !important;
    border-radius: 30px !important;
    border: none !important;
    box-shadow: 0 4px 15px rgba(212, 175, 55, 0.15) !important;
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1) !important;
  }

  #swap_form form button[type="submit"]:hover {
    transform: translateY(-1.5px) scale(1.01) !important;
    box-shadow: 0 6px 20px rgba(212, 175, 55, 0.3) !important;
    filter: brightness(1.1) !important;
  }

  #swap_form form button[type="submit"]:active {
    transform: translateY(0) scale(1) !important;
  }
</style>

<div id="swap_form" class=" h-100 d-flex flex-column justify-content-between">
  <div class="offcanvas-header position-relative text-center">
    <div class="d-flex flex p-3 justify-content-between position-absolute w-100 top-0 start-0">
      <div>
        <p>
          <a hx-get="{% url "contact_form" %}?subject={{btn_text}}" hx-target="#swap_form"
            hx-swap="innerHTML swap:200ms settle:200ms" hx-trigger="click" class="btn btn-sm  rounded-pill"
            role="button">{{btn_text}}</a>
        </p>
      </div>

      <div slass="col-6"></div>

      <div id="close-btn-contact" role="button" class="btn_close col-6 my-auto" data-bs-dismiss="offcanvas"
        aria-label="Close">
        <i class="fas fa-times float-end"></i>
      </div>
    </div>
  </div>

  <div class="offcanvas-body pb-3">
    <div class="col-12 ">
      <h3 id="contact-heading" class="text-uppercase text-center display-6 my-2 clipped-text">
        {{ subject }}
      </h3>
    </div>
    <div class="gradient-line mb-4"></div>

    <form hx-post={% url "send_mail" %} class="my-3 needs-validation" enctype="multipart/form-data" novalidate>
      {% csrf_token %}
      {{ form|crispy }}
      <div class="col-12 mt-2">
          <button class="btn w-100" type="submit" name="submit_button"><i
              class="fa-solid fa-paper-plane"></i>&nbsp{% translate "Submit" %}</button>
        </div>
    </form>

    {% include 'includes/toast_message.html' %}

  </div>

  <div class="offcanvas-footer">

  </div>
</div>

<script>
  var form = document.querySelector('.needs-validation')
  form.addEventListener('submit', function (event) {
    if (!form.checkValidity()) {
      htmx.trigger(form, 'htmx:abort')
      event.preventDefault()
      event.stopPropagation()
    }
    form.classList.add('was-validated')
  }, false)

</script>
