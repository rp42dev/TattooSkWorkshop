{% load i18n %}
{% load static %}
{% load crispy_forms_tags %}

<style>
  ul {
    list-style-type: none;
    margin: 0;
    padding: 0;
    overflow: hidden;
    background-color: #333;
  }

  li {
    float: left;
  }

</style>

<div id="swap_form" class=" h-100 d-flex flex-column justify-content-between">
  <div class="offcanvas-header offcanvas-header-custom">
    <div>
      <a hx-get="{% url "contact_form" %}?subject={{btn_text}}" hx-target="#swap_form"
        hx-swap="innerHTML swap:200ms settle:200ms" hx-trigger="click" class="contact-subject-toggle-btn"
        role="button">{{btn_text}}</a>
    </div>
    <div id="close-btn-contact" role="button" class="close-btn-custom" data-bs-dismiss="offcanvas" aria-label="Close">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="custom-close-svg">
        <line x1="18" y1="6" x2="6" y2="18"></line>
        <line x1="6" y1="6" x2="18" y2="18"></line>
      </svg>
    </div>
  </div>

  <div class="offcanvas-body pb-3">
    <div class="col-12 ">
      <h3 id="contact-heading" class="text-uppercase text-center display-6 my-2 clipped-text">
        {{ subject }}
      </h3>
    </div>
    <div class="gradient-line mb-4"></div>

    <form hx-post={% url "send_mail" %} class="my-3 needs-validation" enctype="multipart/form-data" novalidate>
      {% csrf_token %}
      {{ form|crispy }}
      <div class="col-12 mt-2">
          <button class="btn w-100" type="submit" name="submit_button"><i
              class="bi bi-send"></i>&nbsp;{% translate "Submit" %}</button>
        </div>
    </form>

    {% include 'includes/toast_message.html' %}

  </div>

  <div class="offcanvas-footer">

  </div>
</div>

<script>
  var form = document.querySelector('.needs-validation')
  form.addEventListener('submit', function (event) {
    // Inject invalid feedback if not present
    var ageDiv = document.getElementById('div_id_confirm_age');
    if (ageDiv && !ageDiv.querySelector('.invalid-feedback')) {
      var feedback = document.createElement('div');
      feedback.className = 'invalid-feedback mt-1';
      feedback.style.color = '#dc3545';
      feedback.style.fontSize = '0.75rem';
      var isNo = (document.documentElement.lang === 'no' || window.location.pathname.includes('/no/'));
      feedback.textContent = isNo ? 'Du må godta personvernerklæringen.' : 'You must accept the privacy policy.';
      ageDiv.appendChild(feedback);
    }

    if (!form.checkValidity()) {
      htmx.trigger(form, 'htmx:abort')
      event.preventDefault()
      event.stopPropagation()
    }
    form.classList.add('was-validated')
  }, false)

</script>
