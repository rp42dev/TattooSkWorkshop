{% load i18n %}
<div class="offcanvas offcanvas-end" tabindex="-1" id="menu" data-bs-scroll="true"
    aria-labelledby="menuLabel">
    <div class="offcanvas-header offcanvas-header-custom">
        <div role="button" class="close-btn-custom" data-bs-dismiss="offcanvas" aria-label="Close">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="custom-close-svg">
                <line x1="18" y1="6" x2="6" y2="18"></line>
                <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
        </div>
        <div class="offcanvas-header-title-container"></div>
        <div class="my-auto">
            {% include 'includes/set_lang.html' %}
        </div>
    </div>
    
    <div class="h-auto offcanvas-body direction-rtl mb-3">
        <div>
            <h3 class="text-uppercase text-center display-6 my-2 clipped-text">
                {% translate "Menu" %}
            </h3>
        </div>
        <div class="gradient-line"></div>
        <div class="mt-4 direction-ltr my-auto">
            {% include 'includes/social.html' %}
            {% include 'includes/nav_menu.html' %}
        </div>
       
    </div>
    <div class="offcanvas-footer"></div>
</div>
